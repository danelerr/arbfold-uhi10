name: ARBFOLD verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Prime pinned Solidity compiler
        run: cd contracts && forge build

      - name: Check formatting
        run: make fmt

      - name: Run clean-core Solidity suite
        run: make test-core

      - name: Run frozen benchmark suite
        run: make test-benchmark

      - name: Run research-integrity suite
        run: make test-research

      - name: Run high-severity lints
        run: make lint
