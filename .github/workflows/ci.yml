name: ARBFOLD verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dashboard dependencies
        run: npm ci

      - name: Install pinned static analyzer
        run: python -m pip install --requirement requirements-ci.txt

      - name: Prime pinned Solidity compiler
        run: cd contracts && forge build

      - name: Check formatting
        run: make fmt

      - name: Run clean-core equivalence benchmark
        run: |
          set +e
          output=$(cd contracts && forge test --offline --match-contract ArbFoldCleanCoreBenchmarkTest -vv 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s\n' "$output" | tail -n 60 | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            printf '::error title=Clean-core equivalence failure::%s\n' "$message"
          fi
          exit "$status"

      - name: Run clean-core unit and fuzz tests
        if: ${{ !cancelled() }}
        run: make test-core

      - name: Run release fuzz and all-path invariants
        if: ${{ !cancelled() }}
        run: make test-release-fuzz

      - name: Verify the arithmetic domain
        if: ${{ !cancelled() }}
        run: make arithmetic

      - name: Run deployment and post-deployment smoke test
        if: ${{ !cancelled() }}
        run: make test-deployment

      - name: Run frozen benchmark suite
        if: ${{ !cancelled() }}
        run: make test-benchmark

      - name: Run research-integrity suite
        if: ${{ !cancelled() }}
        run: make test-research

      - name: Test and build the live dashboard
        if: ${{ !cancelled() }}
        run: |
          make test-dashboard
          make build-dashboard

      - name: Run high-severity lints
        if: ${{ !cancelled() }}
        run: make lint

      - name: Run Slither with reviewed-finding gate
        if: ${{ !cancelled() }}
        run: make slither

      - name: Generate and enforce project coverage
        if: ${{ !cancelled() }}
        run: make coverage

      - name: Verify release source manifest
        if: ${{ !cancelled() }}
        run: make source-manifest-check

      - name: Upload release evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: arbfold-release-evidence
          if-no-files-found: error
          path: |
            contracts/lcov.info
            contracts/slither-report.json
            benchmark/optimized-release-candidate-results/source-manifest.sha256
