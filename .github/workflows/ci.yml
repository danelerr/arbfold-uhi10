name: ARBFOLD verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Prime pinned Solidity compiler
        run: cd contracts && forge build

      - name: Check formatting
        run: make fmt

      - name: Run clean-core equivalence benchmark
        run: |
          set +e
          output=$(cd contracts && forge test --offline --match-contract ArbFoldCleanCoreBenchmarkTest -vv 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s\n' "$output" | tail -n 60 | python3 -c 'import sys; s=sys.stdin.read(); print(s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')
            printf '::error title=Clean-core equivalence failure::%s\n' "$message"
          fi
          exit "$status"

      - name: Run clean-core unit and fuzz tests
        if: ${{ !cancelled() }}
        run: cd contracts && forge test --offline --match-contract ArbFoldTest

      - name: Run clean-core invariant tests
        if: ${{ !cancelled() }}
        run: cd contracts && forge test --offline --match-contract ArbFoldInvariantTest

      - name: Run frozen benchmark suite
        if: ${{ !cancelled() }}
        run: make test-benchmark

      - name: Run research-integrity suite
        if: ${{ !cancelled() }}
        run: make test-research

      - name: Run high-severity lints
        if: ${{ !cancelled() }}
        run: make lint
