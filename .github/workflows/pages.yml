name: Deploy ARBFOLD dashboard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "deployments/unichain-sepolia-1301.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage dashboard and optional public deployment evidence
        run: |
          mkdir -p _site/deployments
          cp -R app/. _site/
          if [[ -f deployments/unichain-sepolia-1301.json ]]; then
            cp deployments/unichain-sepolia-1301.json _site/deployments/
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
