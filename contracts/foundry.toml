[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib/openzeppelin-uniswap-hooks"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# HookMiner's offline CREATE2 search is intentionally outside measured runtime gas.
gas_limit = 2000000000
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = true

[profile.release.fuzz]
runs = 10000

[profile.release.invariant]
runs = 256
depth = 80
fail_on_revert = true

[profile.arithmetic.fuzz]
runs = 50000
